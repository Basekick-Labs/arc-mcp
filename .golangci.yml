version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - bodyclose
    - noctx
    - misspell
    - unconvert
    - ineffassign
    - unused
  settings:
    gosec:
      excludes:
        - G115   # integer overflow conversions — guarded explicitly where relevant
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
