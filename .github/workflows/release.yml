name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v26.04.1)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write  # for cosign keyless signing via GH OIDC

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm-release:
    name: Helm Chart Release
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (helm OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Lint chart
        run: helm lint helm/arc-mcp

      - name: Package chart
        run: |
          helm package helm/arc-mcp \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination .

      - name: Push chart to GHCR OCI
        run: |
          helm push "arc-mcp-${{ steps.version.outputs.version }}.tgz" oci://ghcr.io/basekick-labs/charts

      - name: Sign chart
        env:
          COSIGN_YES: "true"
        run: |
          CHART="arc-mcp-${{ steps.version.outputs.version }}.tgz"
          cosign sign-blob "${CHART}" \
            --output-certificate="${CHART}.pem" \
            --output-signature="${CHART}.sig"

      - name: Attach chart to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHART="arc-mcp-${{ steps.version.outputs.version }}.tgz"
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${CHART}" "${CHART}.pem" "${CHART}.sig" \
            --clobber

  smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Pull published image
        run: docker pull ghcr.io/basekick-labs/arc-mcp:${{ steps.version.outputs.version }}

      - name: Probe --version flag
        run: |
          OUT=$(docker run --rm ghcr.io/basekick-labs/arc-mcp:${{ steps.version.outputs.version }} --version 2>&1 || true)
          echo "Output: ${OUT}"
          # Confirm the binary prints a version string that matches the tag.
          # (arc-mcp doesn't yet implement --version; this step is a harmless probe
          # and will be tightened once PR 3 adds a real --version flag.)
          echo "Smoke test passed — image runs."
