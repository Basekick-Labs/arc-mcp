name: Release

# Fires on every v* tag, or by hand (workflow_dispatch) for an existing tag:
# the newest final tag, or a prerelease. GoReleaser builds the archives,
# packages, the Claude Desktop extension (.mcpb, packed before checksums by
# mcpb/pack.sh), images and the Homebrew formula, and publishes images →
# GitHub release → formula (.goreleaser.yml). A formula push that fails would leave
# a complete release with no tap entry, so the job first refuses a tag that
# is not on main, an older final tag, and a missing or dead tap token.
# Rerunning a tag replaces the release's assets (replace_existing_artifacts);
# the archives and the .mcpb rebuild byte-identical, so the formula's sha256s
# and the bundle's checksum line still hold.
#
# Actions are SHA-pinned here: this workflow holds contents:write,
# packages:write, an OIDC identity that mints signing certificates in the
# repo's name, and a PAT to the tap.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v26.04.1)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write  # for cosign keyless signing via GH OIDC

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false # GoReleaser publishes through the API, not git

      - name: Refuse a tag that is not on main, or an older release
        # A dispatched run checks out inputs.tag, so this covers it too. A
        # final tag must be the newest final tag: GoReleaser rewrites the
        # formula and :latest with no version check, so releasing an older
        # tag again would move both back. Prereleases push no formula.
        run: |
          git fetch --no-tags origin main
          commit=$(git rev-parse "HEAD^{commit}")
          if ! tagged=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}") || [ "$tagged" != "$commit" ]; then
            echo "::error::$TAG is not a tag of the checked-out commit $commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag $TAG ($commit) is not reachable from main: push main first (or re-create the tag on a main commit), then re-run this workflow"
            exit 1
          fi
          newest=$(git tag -l 'v*' --sort=-v:refname | grep -v -e '-' | head -n1)
          case $TAG in
            *-*) ;;
            *) if [ "$TAG" != "$newest" ]; then
                 echo "::error::$TAG is not the newest release ($newest): releasing it again would move the tap formula and :latest back"
                 exit 1
               fi ;;
          esac

      - name: Refuse to run without a working Homebrew tap token
        # The formula push is GoReleaser's last publish step, so a missing,
        # expired or revoked token would otherwise surface only after the
        # images and the release are public. This GET proves the token is set
        # and valid; the tap is public, so it does not prove write access. A
        # token without contents:write still fails at the formula push: fix
        # the secret and rerun the tag. Prereleases push no formula but are
        # held to the same check. curl never echoes the request header, and
        # GitHub masks the secret.
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set (fine-grained PAT, contents:write on Basekick-Labs/homebrew-tap)"
            exit 1
          fi
          hdr=$(mktemp)
          if ! curl -fsS -o /dev/null -D "$hdr" -H "Authorization: Bearer $HOMEBREW_TAP_TOKEN" \
               https://api.github.com/repos/Basekick-Labs/homebrew-tap; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot read Basekick-Labs/homebrew-tap (expired, revoked or wrong repository access?)"
            exit 1
          fi
          # Fine-grained PATs carry an expiration header; classic ones do
          # not. Never let this informational line decide the exit status.
          exp=$(grep -i '^github-authentication-token-expiration:' "$hdr" | cut -d' ' -f2- | tr -d '\r' || true)
          if [ -n "$exp" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN expires $exp"
          else
            echo "::notice::HOMEBREW_TAP_TOKEN has no expiration header (classic PAT?)"
          fi

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.11'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2.20' # 2.20.x patch releases; brews is kept until GoReleaser v3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # The tag checked above. Left to itself GoReleaser takes the first
          # tag at HEAD in version order, which puts v26.05.1-rc.1 before
          # v26.05.1: a final tagged on its rc's commit would re-release the rc.
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

  helm-release:
    name: Helm Chart Release
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: '3.14.0'

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Log in to GHCR (helm OCI)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Lint chart
        run: helm lint helm/arc-mcp

      - name: Package chart
        run: |
          helm package helm/arc-mcp \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination .

      - name: Push chart to GHCR OCI
        run: |
          helm push "arc-mcp-${{ steps.version.outputs.version }}.tgz" oci://ghcr.io/basekick-labs/charts

      - name: Sign chart
        env:
          COSIGN_YES: "true"
        run: |
          CHART="arc-mcp-${{ steps.version.outputs.version }}.tgz"
          cosign sign-blob "${CHART}" \
            --output-certificate="${CHART}.pem" \
            --output-signature="${CHART}.sig"

      - name: Attach chart to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHART="arc-mcp-${{ steps.version.outputs.version }}.tgz"
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${CHART}" "${CHART}.pem" "${CHART}.sig" \
            --clobber

  smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Pull published image
        run: docker pull ghcr.io/basekick-labs/arc-mcp:${{ steps.version.outputs.version }}

      - name: Verify image starts and logs a server boot line
        run: |
          # arc-mcp is a stdio MCP server. Without an attached MCP client over
          # stdin it sees EOF and exits cleanly — that's the signal we want.
          # Drop --rm so docker logs can still read the log after exit, and
          # feed /dev/null to stdin so the exit is deterministic. The health
          # check is expected to fail (invalid URL); we only assert the server
          # booted far enough to log.
          docker run -d --name smoke -i \
            -e ARC_URL=http://127.0.0.1:65535 \
            ghcr.io/basekick-labs/arc-mcp:${{ steps.version.outputs.version }} \
            < /dev/null
          # Give it a moment to log; then fetch logs whether running or exited.
          sleep 3
          docker logs smoke 2>&1 | tee /tmp/smoke.log
          docker rm -f smoke || true
          grep -q "arc-mcp server starting" /tmp/smoke.log

      - name: Verify the HTTP transport answers /healthz
        run: |
          docker run -d --name smoke-http -p 127.0.0.1:18080:8080 \
            -e ARC_URL=http://127.0.0.1:65535 \
            -e ARC_MCP_HTTP_TOKEN=smoke-test-token \
            ghcr.io/basekick-labs/arc-mcp:${{ steps.version.outputs.version }} \
            --transport http --listen 0.0.0.0:8080
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:18080/healthz && break; sleep 1; done
          docker logs smoke-http 2>&1 | tee /tmp/smoke-http.log
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' http://127.0.0.1:18080/mcp -d '{}')
          docker rm -f smoke-http || true
          grep -q "arc-mcp serving" /tmp/smoke-http.log
          test "$code" = 401

  brew-smoke:
    # Installs the formula GoReleaser just pushed, from the public tap, the
    # way users will, and runs its test. A prerelease gets no formula
    # (skip_upload: auto in .goreleaser.yml), so the job skips it by the same
    # semver rule: a "-" in the version, build metadata aside.
    name: Homebrew smoke test (${{ matrix.os }})
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions: {}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - name: Skip prereleases
        id: pre
        run: |
          v=${TAG#v}
          case ${v%%+*} in
            *-*) echo "::notice::$TAG is a prerelease: no formula is published"; echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Put Homebrew on PATH (Linux)
        # Preinstalled on the Ubuntu image, but not on PATH.
        if: steps.pre.outputs.skip == 'false' && runner.os == 'Linux'
        run: |
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo "::error::no Homebrew at /home/linuxbrew/.linuxbrew on this runner image"; exit 1
          fi
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"

      - name: Install from basekick-labs/tap and run the formula's test
        if: steps.pre.outputs.skip == 'false'
        run: |
          brew install basekick-labs/tap/arc-mcp
          test "$(arc-mcp --version)" = "${TAG#v}"
          brew test basekick-labs/tap/arc-mcp
