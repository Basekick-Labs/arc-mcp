name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: Tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.out ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          # Must be a golangci-lint built with Go >= 1.26 because our go.mod
          # declares go 1.26. v2.11.0+ is built with Go 1.26.
          # golangci-lint-action v7 is required for golangci-lint v2.
          version: v2.11.4

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # needed for SARIF upload to code scanning
    steps:
      - uses: actions/checkout@v4
      - uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: Cross-compile all targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            echo "Building ${os}/${arch}"
            GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/arc-mcp
          done

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: check

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: '3.14.0'
      - name: Lint Helm chart
        run: helm lint helm/arc-mcp
      - name: Render Helm chart
        run: |
          helm template t helm/arc-mcp --set http.tokenSecretRef.name=tok >/dev/null
          helm template t helm/arc-mcp --set http.tokenSecretRef.name=tok --set http.tlsSecretName=tls >/dev/null
          helm template t helm/arc-mcp --set http.insecureListen=true >/dev/null
          helm template t helm/arc-mcp --set auth.mode=passthrough --set http.tlsUpstream=true --set arc.insecure=true >/dev/null
          if helm template t helm/arc-mcp --set auth.mode=passthrough --set arc.insecure=true >/dev/null 2>&1; then echo "passthrough TLS guard missing"; exit 1; fi
          if helm template t helm/arc-mcp --set auth.mode=passthrough --set http.tlsUpstream=true --set arc.insecure=true --set arc.token=x >/dev/null 2>&1; then echo "passthrough guard missing"; exit 1; fi
          helm lint helm/arc-mcp --set http.insecureListen=true
          # The guards must refuse, with their own message: no inbound token,
          # and the removed gateway values.
          if out=$(helm template t helm/arc-mcp 2>&1); then echo "token guard missing"; exit 1; fi
          grep -q 'set http.tokenSecretRef.name' <<<"$out"
          if out=$(helm template t helm/arc-mcp --set http.insecureListen=true --set gateway.enabled=true 2>&1); then echo "gateway guard missing"; exit 1; fi
          grep -q 'gateway.\* values were removed' <<<"$out"
