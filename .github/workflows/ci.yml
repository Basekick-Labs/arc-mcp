name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: Tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.out ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          # Must be a golangci-lint built with Go >= 1.26 because our go.mod
          # declares go 1.26. v2.11.0+ is built with Go 1.26.
          # golangci-lint-action v7 is required for golangci-lint v2.
          version: v2.11.4

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # needed for SARIF upload to code scanning
    steps:
      - uses: actions/checkout@v4
      - uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - name: Cross-compile all targets
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            echo "Building ${os}/${arch}"
            GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/arc-mcp
          done

  release-dry-run:
    # Runs .goreleaser.yml as a snapshot: builds every target, renders the
    # archives, packages, the Claude Desktop extension and the Homebrew
    # formula, publishes nothing. Docker,
    # signing and SBOMs are left to the tag build. No secrets are read, so a
    # PR from a fork runs it the same way (the tap token is evaluated only
    # when a release pushes the formula).
    name: Release dry run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2.20' # 2.20.x, as release.yml; brews is kept until GoReleaser v3
          install-only: true
      - name: goreleaser check
        # Exit 2 is "valid, but uses deprecated properties": brews is
        # deprecated in favour of casks and kept on purpose (.goreleaser.yml).
        # Every deprecation is still shown as a warning; any other failure fails.
        # GoReleaser colours its output when CI is set: the escapes are
        # stripped before the DEPRECATED lines become annotations.
        run: |
          rc=0
          goreleaser check > check.log 2>&1 || rc=$?
          cat check.log
          sed 's/\x1b\[[0-9;]*m//g' check.log > check.txt
          case $rc in
            0) ;;
            2) grep -o 'DEPRECATED:.*' check.txt | while read -r line; do echo "::warning::goreleaser check: $line"; done ;;
            *) exit "$rc" ;;
          esac
      - name: GoReleaser snapshot
        run: goreleaser release --snapshot --clean --skip=publish,sign,sbom,docker
      - name: Check the rendered formula
        # Four per-platform URLs, each with its archive's sha256, the install
        # and test lines, and the version the formula's test compares against.
        run: |
          f=dist/homebrew/Formula/arc-mcp.rb
          v=$(jq -r .version dist/metadata.json)
          cat "$f"
          test "$(grep -c 'url "https://github.com/basekick-labs/arc-mcp/releases/download/' "$f")" -eq 4
          for p in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            n="arc-mcp_${v}_${p}.tar.gz"
            sum=$(awk -v n="$n" '$2 == n { print $1 }' dist/checksums.txt)
            test -n "$sum"
            grep -A1 "url \".*/$n\"" "$f" | grep -q "sha256 \"$sum\""
          done
          grep -qF 'bin.install "arc-mcp"' "$f"
          grep -qF 'assert_match version.to_s, shell_output("#{bin}/arc-mcp --version")' "$f"
          tar -xzf "dist/arc-mcp_${v}_linux_amd64.tar.gz" -C "$RUNNER_TEMP" arc-mcp
          test "$("$RUNNER_TEMP/arc-mcp" --version)" = "$v"
      - name: Check the extension bundle
        # The bundle the universal binary's hook packed (mcpb/pack.sh): named
        # with GoReleaser's version, listed in checksums.txt, its manifest
        # version semver. A snapshot version has no leading zeros, so the
        # script also packs the same binaries as 26.04.3, a real tag's shape.
        # The universal binary must not ship as an archive of its own.
        run: |
          v=$(jq -r .version dist/metadata.json)
          b="dist/arc-mcp-$v.mcpb"
          unzip -Z "$b"
          test "$(unzip -p "$b" manifest.json | jq -r .version)" = "$v"
          grep -q "  arc-mcp-$v.mcpb\$" dist/checksums.txt
          test "$(find dist -maxdepth 1 -type f -name '*darwin_all*' | wc -l)" -eq 0
          mkdir "$RUNNER_TEMP/tag"
          sh mcpb/pack.sh dist/arc-mcp-universal_darwin_all/arc-mcp 26.04.3 "$(git log -1 --format=%ct)" "$RUNNER_TEMP/tag"
          test "$(unzip -p "$RUNNER_TEMP/tag/arc-mcp-26.04.3.mcpb" manifest.json | jq -r .version)" = 26.4.3
      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist/*.mcpb
            dist/*.tar.gz
            dist/checksums.txt
            dist/metadata.json
            dist/homebrew/Formula/arc-mcp.rb
          if-no-files-found: error
          retention-days: 7

  formula:
    # Installs the dry run's formula the way brew installs the released one,
    # from the local archives: Homebrew refuses a formula file outside a tap,
    # so it goes into a throwaway local tap, its URLs rewritten to file://
    # (the sha256s stay valid). Then the formula's own test. The macOS leg
    # runs the darwin archive's binary.
    name: Formula (${{ matrix.os }})
    needs: release-dry-run
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions: {}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dry-run
          path: dist
      - name: Put Homebrew on PATH (Linux)
        # Preinstalled on the Ubuntu image, but not on PATH.
        if: runner.os == 'Linux'
        run: |
          if [ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo "::error::no Homebrew at /home/linuxbrew/.linuxbrew on this runner image"; exit 1
          fi
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install from a local tap and run the formula's test
        run: |
          v=$(jq -r .version dist/metadata.json)
          brew tap-new --no-git local/arcmcp-ci
          tap=$(brew --repository local/arcmcp-ci)
          sed "s#https://github.com/basekick-labs/arc-mcp/releases/download/[^/]*/#file://$PWD/dist/#" \
            dist/homebrew/Formula/arc-mcp.rb > "$tap/Formula/arc-mcp.rb"
          if grep -q 'releases/download/' "$tap/Formula/arc-mcp.rb"; then
            echo "::error::a formula URL still points at a release"; exit 1
          fi
          brew install local/arcmcp-ci/arc-mcp
          test "$(arc-mcp --version)" = "$v"
          brew test local/arcmcp-ci/arc-mcp

  extension:
    # The Claude Desktop extension as the app gets it: unpacked with the mcpb
    # CLI, validated, then started through mcpb's own resolver for this
    # platform (mcpb/smoke.mjs) against an unreachable Arc at a non-default
    # URL, with a hostile inherited environment. macOS checks the universal
    # binary (both slices; Go signs the arm64 one only) and runs it from mode
    # 0755 and 0600 (the launcher's chmod, mcpb#294); Windows runs the win32
    # override. npm runs in this job only: no secrets, read-only token.
    name: Extension (${{ matrix.os }})
    needs: release-dry-run
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SMOKE_ARC_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: mcpb
      - uses: actions/download-artifact@v4
        with:
          name: release-dry-run
          path: dist
      - name: Install the mcpb CLI
        # An exact version and no install scripts; its own dependencies float.
        run: |
          npm install --prefix "$RUNNER_TEMP/mcpb" --ignore-scripts --no-audit --no-fund @anthropic-ai/mcpb@2.1.2
          echo "MCPB_PKG=$RUNNER_TEMP/mcpb/node_modules/@anthropic-ai/mcpb" >> "$GITHUB_ENV"
      - name: Unpack and validate
        # tr: a native jq on Windows may end its output with CRLF.
        run: |
          v=$(jq -r .version dist/metadata.json | tr -d '\r')
          node "$MCPB_PKG/dist/cli/cli.js" unpack "dist/arc-mcp-$v.mcpb" "$RUNNER_TEMP/ext"
          node "$MCPB_PKG/dist/cli/cli.js" validate "$RUNNER_TEMP/ext/manifest.json"
          node "$MCPB_PKG/dist/cli/cli.js" info "dist/arc-mcp-$v.mcpb"
      - name: Check the universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          b="$RUNNER_TEMP/ext/server/arc-mcp"
          test -x "$b"
          lipo "$b" -verify_arch x86_64 arm64
          codesign -v -a arm64 "$b"
      - name: Start it as Claude Desktop would
        run: node mcpb/smoke.mjs "$RUNNER_TEMP/ext"
      - name: Start it from a non-executable file (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod 600 "$RUNNER_TEMP/ext/server/arc-mcp"
          node mcpb/smoke.mjs "$RUNNER_TEMP/ext"

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: '3.14.0'
      - name: Lint Helm chart
        run: helm lint helm/arc-mcp
      - name: Render Helm chart
        run: |
          helm template t helm/arc-mcp --set http.tokenSecretRef.name=tok >/dev/null
          helm template t helm/arc-mcp --set http.tokenSecretRef.name=tok --set http.tlsSecretName=tls >/dev/null
          helm template t helm/arc-mcp --set http.insecureListen=true >/dev/null
          helm template t helm/arc-mcp --set auth.mode=passthrough --set http.tlsUpstream=true --set arc.insecure=true >/dev/null
          if helm template t helm/arc-mcp --set auth.mode=passthrough --set arc.insecure=true >/dev/null 2>&1; then echo "passthrough TLS guard missing"; exit 1; fi
          if helm template t helm/arc-mcp --set auth.mode=passthrough --set http.tlsUpstream=true --set arc.insecure=true --set arc.token=x >/dev/null 2>&1; then echo "passthrough guard missing"; exit 1; fi
          helm lint helm/arc-mcp --set http.insecureListen=true
          # The guards must refuse, with their own message: no inbound token,
          # and the removed gateway values.
          if out=$(helm template t helm/arc-mcp 2>&1); then echo "token guard missing"; exit 1; fi
          grep -q 'set http.tokenSecretRef.name' <<<"$out"
          if out=$(helm template t helm/arc-mcp --set http.insecureListen=true --set gateway.enabled=true 2>&1); then echo "gateway guard missing"; exit 1; fi
          grep -q 'gateway.\* values were removed' <<<"$out"
