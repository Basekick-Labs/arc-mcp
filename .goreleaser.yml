# GoReleaser configuration for arc-mcp.
# https://goreleaser.com
#
# Triggered by a git tag push matching v*. Produces:
#   - Platform binaries (linux/darwin/windows × amd64/arm64, skip windows/arm64)
#   - .tar.gz / .zip archives
#   - arc-mcp-<version>.mcpb, the Claude Desktop extension (mcpb/pack.sh)
#   - checksums.txt (sha256)
#   - SPDX SBOM per archive via syft
#   - .deb and .rpm packages (amd64, arm64)
#   - Multi-arch Docker images to ghcr.io/basekick-labs/arc-mcp
#   - Cosign signatures (keyless via GH OIDC) for blobs and images
#   - GitHub Release
#   - Homebrew formula in Basekick-Labs/homebrew-tap (final releases only)
#
# Publish order is images → GitHub release → formula. CI's release-dry-run
# job runs this file as a snapshot on every PR (nothing is published).

version: 2

project_name: arc-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: arc-mcp
    main: ./cmd/arc-mcp
    binary: arc-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    # Reproducible: a rerun of the same tag rebuilds byte-identical binaries,
    # archives and debs (no build time, no build path, commit-date mtimes),
    # so the formula's sha256s stay valid. The archives record the building
    # user's name, the rpms the build host's. main.go has no Commit or
    # BuildTime variable, so no -X for them: they only stamped the time.
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}

# The darwin amd64 + arm64 binaries merged into one, for the Claude Desktop
# extension only: its manifest has one darwin entry point, with no arch key
# (mcpb#10). The post hook packs dist/arc-mcp-<version>.mcpb (mcpb/pack.sh)
# after every build is done and before archives and checksums, so a failed
# pack stops the release before anything is published. The hook starts
# from an empty environment plus PATH: it sees none of the release's tokens.
universal_binaries:
  - id: arc-mcp-universal
    ids: [arc-mcp]
    name_template: arc-mcp
    replace: false
    mod_timestamp: '{{ .CommitTimestamp }}'
    hooks:
      post:
        - cmd: env -i "PATH={{ .Env.PATH }}" sh mcpb/pack.sh "{{ .Path }}" "{{ .Version }}" "{{ .CommitTimestamp }}"
          output: true

archives:
  - id: default
    # Only the per-platform builds: without this the universal binary would
    # ship as a sixth, darwin_all archive.
    ids: [arc-mcp]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: ['zip']
    builds_info:
      mtime: '{{ .CommitDate }}'
    files:
      - src: LICENSE
        info:
          mtime: '{{ .CommitDate }}'
      - src: README.md
        info:
          mtime: '{{ .CommitDate }}'

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256
  # The extension, so the signed checksums.txt covers it. An exact name, not
  # a pattern: a missing bundle fails the checksum step.
  extra_files:
    - glob: ./dist/arc-mcp-{{ .Version }}.mcpb

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'

# System packages (.deb, .rpm).
# arc-mcp is a client binary spawned by LLM tools — no systemd service.
nfpms:
  - id: packages
    package_name: arc-mcp
    vendor: Basekick Labs
    homepage: https://github.com/basekick-labs/arc-mcp
    maintainer: Basekick Labs <support@basekick.net>
    description: MCP server for Arc, a high-performance columnar analytical database.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    mtime: '{{ .CommitDate }}'
    contents:
      - src: LICENSE
        dst: /usr/share/doc/arc-mcp/LICENSE
      - src: README.md
        dst: /usr/share/doc/arc-mcp/README.md

# Docker images — multi-arch to GHCR.
dockers:
  - id: amd64
    image_templates:
      - "ghcr.io/basekick-labs/arc-mcp:{{ .Version }}-amd64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=MCP server for Arc"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.licenses=MIT"

  - id: arm64
    image_templates:
      - "ghcr.io/basekick-labs/arc-mcp:{{ .Version }}-arm64"
    use: buildx
    dockerfile: Dockerfile
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=MCP server for Arc"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/basekick-labs/arc-mcp:{{ .Version }}"
    image_templates:
      - "ghcr.io/basekick-labs/arc-mcp:{{ .Version }}-amd64"
      - "ghcr.io/basekick-labs/arc-mcp:{{ .Version }}-arm64"

  - name_template: "ghcr.io/basekick-labs/arc-mcp:{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "ghcr.io/basekick-labs/arc-mcp:{{ .Version }}-amd64"
      - "ghcr.io/basekick-labs/arc-mcp:{{ .Version }}-arm64"

  - name_template: "ghcr.io/basekick-labs/arc-mcp:latest"
    image_templates:
      - "ghcr.io/basekick-labs/arc-mcp:{{ .Version }}-amd64"
      - "ghcr.io/basekick-labs/arc-mcp:{{ .Version }}-arm64"

# Cosign keyless signing — uses GH OIDC, no keys to manage.
# Verify with: cosign verify-blob --certificate ... --signature ...
signs:
  - cmd: cosign
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--yes'
      - '--output-certificate=${certificate}'
      - '--output-signature=${signature}'
      - '${artifact}'
    artifacts: checksum
    output: true

docker_signs:
  - cmd: cosign
    args:
      - sign
      - '--yes'
      - '${artifact}'
    artifacts: manifests
    output: true

# Homebrew formula: `brew install basekick-labs/tap/arc-mcp`, pushed to
# Basekick-Labs/homebrew-tap as arcli's is. Needs the HOMEBREW_TAP_TOKEN
# secret (fine-grained PAT, contents:write on the tap); release.yml refuses
# to start without it. `brews` is deprecated in favour of casks, so
# `goreleaser check` exits 2 ("valid, but uses deprecated properties"); CI
# and `make check` accept that exit. Kept until GoReleaser v3, as in arcli,
# whose formula is in the same tap. No cask: the macOS binary is not signed
# or notarised, so a cask would need GoReleaser's post-install hook that
# strips the quarantine attribute, i.e. bypasses Gatekeeper.
brews:
  - name: arc-mcp
    ids: [default]
    repository:
      owner: Basekick-Labs
      name: homebrew-tap
      branch: main
      # Evaluated only when the formula is pushed, the last publish step:
      # snapshots and fork PRs render the formula without the secret.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "arc-mcp {{ .Tag }}"
    homepage: https://github.com/Basekick-Labs/arc-mcp
    description: MCP server for Arc, the time-series lakehouse
    license: MIT
    # No formula for a prerelease tag (v26.05.1-rc.1), the same semver rule
    # as `prerelease: auto` below.
    skip_upload: auto
    install: |
      bin.install "arc-mcp"
    test: |
      assert_match version.to_s, shell_output("#{bin}/arc-mcp --version")

release:
  github:
    owner: basekick-labs
    name: arc-mcp
  draft: false
  prerelease: auto
  # GoReleaser uploads the assets to a draft and publishes it only once all
  # are up, so a failed upload leaves a draft, not a public release. The
  # formula is pushed after that. Rerunning the tag after a failed formula
  # push finds the published release and replaces its assets instead of
  # stopping at the first one that already exists. The archives and debs
  # come out byte-identical (builds above); the rpms (build host name) and
  # the SBOMs (syft stamps a creation time and a random namespace) do not, so
  # checksums.txt and its signature are new. A rerun also resets a
  # hand-edited release title and prerelease flag; the notes are kept.
  replace_existing_artifacts: true
  extra_files:
    - glob: ./dist/arc-mcp-{{ .Version }}.mcpb
  name_template: "arc-mcp v{{ .Version }}"
  header: |
    arc-mcp {{ .Version }} — MCP server for [Arc](https://github.com/basekick-labs/arc).
  footer: |
    **Verify signatures:**
    ```
    cosign verify-blob \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp '^https://github\.com/Basekick-Labs/arc-mcp/\.github/workflows/release\.yml@refs/(tags/v[^/]+|heads/main)$' \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      checksums.txt
    ```
