# Default values for arc-mcp.
# This chart deploys arc-mcp serving MCP over Streamable HTTP at /mcp, so
# remote LLM clients can connect over the network.

replicaCount: 1

image:
  repository: ghcr.io/basekick-labs/arc-mcp
  # tag defaults to the chart's appVersion (set by CI)
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Connection to Arc.
arc:
  # Required: URL of the Arc instance reachable from the pod.
  url: "http://arc.arc.svc.cluster.local:8000"
  # Inline token — only used if tokenSecretRef.name is empty. Prefer tokenSecretRef.
  token: ""
  # Reference to a pre-existing Secret holding the Arc API token.
  # Recommended: create the Secret yourself via `kubectl create secret generic`
  # or your GitOps/SealedSecrets tooling, and reference it here.
  tokenSecretRef:
    name: ""
    key: "token"
  # Enforce HTTPS + tell arc-mcp not to accept plaintext HTTP + token unless
  # the Arc URL is loopback. Set true only if you knowingly point at a
  # non-loopback http:// endpoint and accept the credential-leak risk.
  insecure: false
  # Row cap and timeout passed to arc-mcp.
  maxRows: 500
  timeout: "30s"
  maxResponseSize: 50000
  # Tool groups arc-mcp serves (ARC_MCP_TOOLS): data, ops for Arc's health
  # and metrics tools, and enterprise for its licence, clustering and
  # schedulers. A list: --set 'arc.tools={data,ops}'.
  tools:
    - data

# How callers authenticate (ARC_MCP_AUTH_MODE):
#   static       arc-mcp queries Arc with its own token (arc.token or
#                arc.tokenSecretRef), and callers present the shared
#                http.tokenSecretRef token (or none, with http.insecureListen).
#   passthrough  each caller's bearer token is its own Arc token, verified
#                with Arc and sent on every query it makes. Set no arc token
#                and no http token. Arc must have authentication on.
auth:
  mode: static

# The MCP endpoint (arc-mcp --transport http): Streamable HTTP at /mcp,
# liveness at /healthz.
http:
  port: 8080
  # Required unless insecureListen: a pre-existing Secret holding the bearer
  # token MCP clients must send. Mounted as a file (ARC_MCP_HTTP_TOKEN_FILE).
  #   kubectl create secret generic arc-mcp-http --from-literal=token=$(openssl rand -hex 32)
  tokenSecretRef:
    name: ""
    key: "token"
  # Serve without an inbound token. Anyone who can reach the Service then
  # queries Arc with arc-mcp's Arc token: only with network policies of your
  # own restricting who can reach it.
  insecureListen: false
  # Requests served at once (ARC_MCP_MAX_CONCURRENT); 0 for no limit.
  maxConcurrent: 8
  # Serve HTTPS from a kubernetes.io/tls Secret (tls.crt, tls.key). Otherwise
  # terminate TLS at your ingress: the bearer token travels in every request.
  tlsSecretName: ""
  # TLS terminates in front of arc-mcp (your ingress). Passthrough needs this
  # or tlsSecretName: its bearer tokens are callers' Arc credentials.
  tlsUpstream: false

# Room for queries in flight to finish on shutdown: arc-mcp waits up to
# 4 x arc.timeout + 5s (125s at the default 30s). Raise it with arc.timeout.
terminationGracePeriodSeconds: 130

# More arc-mcp flags, and more environment variables for its container.
extraArgs: []
extraEnv: []

service:
  type: ClusterIP
  port: 8080
  annotations: {}

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

# /healthz answers without calling Arc, so a slow Arc does not restart pods.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
