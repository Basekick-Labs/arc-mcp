{{/*
Create a chart-managed Secret only if the user provided an inline token AND
did NOT reference a pre-existing Secret. This lets operators wire their own
Secret (recommended) or accept the chart's default for quick-start.
*/}}
{{- if and (not .Values.arc.tokenSecretRef.name) .Values.arc.token -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arc-mcp.fullname" . }}
  labels:
    {{- include "arc-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.arc.token | quote }}
{{- end }}
