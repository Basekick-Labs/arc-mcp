{{/*
arc-mcp Deployment: the arc-mcp image serving MCP over Streamable HTTP at
/mcp (--transport http). The supergateway image and the gateway.* values are
gone; fail with the way forward rather than ignore them.
*/}}
{{- $insecureListen := eq (toString .Values.http.insecureListen) "true" }}
{{- $passthrough := eq (toString .Values.auth.mode) "passthrough" }}
{{- if not (has (toString .Values.auth.mode) (list "static" "passthrough")) }}
{{- fail "auth.mode is static or passthrough" }}
{{- end }}
{{- if .Values.gateway }}
{{- fail "gateway.* values were removed: arc-mcp now serves MCP over Streamable HTTP itself, at /mcp (clients that used /sse must switch). Remove gateway.* (with helm upgrade --reuse-values, use --reset-then-reuse-values instead) and set http.tokenSecretRef.name or http.insecureListen. See \"Remote access over HTTP\" in the arc-mcp README." }}
{{- end }}
{{- $tlsUpstream := eq (toString .Values.http.tlsUpstream) "true" }}
{{- if $passthrough }}
{{- if or .Values.arc.token .Values.arc.tokenSecretRef.name .Values.http.tokenSecretRef.name $insecureListen }}
{{- fail "auth.mode=passthrough uses each caller's Arc token: unset arc.token, arc.tokenSecretRef.name, http.tokenSecretRef.name and http.insecureListen." }}
{{- end }}
{{- if and (not .Values.http.tlsSecretName) (not $tlsUpstream) }}
{{- fail "auth.mode=passthrough: every request carries a caller's Arc token, so serve TLS (http.tlsSecretName) or set http.tlsUpstream=true when your ingress terminates TLS." }}
{{- end }}
{{- if and (not (hasPrefix "https://" .Values.arc.url)) (ne (toString .Values.arc.insecure) "true") }}
{{- fail "auth.mode=passthrough sends callers' tokens to arc.url: use an https:// arc.url, or set arc.insecure=true for a plain-HTTP Arc inside the cluster." }}
{{- end }}
{{- else }}
{{- if and (not .Values.http.tokenSecretRef.name) (not $insecureListen) }}
{{- fail "set http.tokenSecretRef.name to a Secret holding the bearer token MCP clients send, or http.insecureListen=true to serve without one (anyone who can reach the Service then queries Arc with arc-mcp's token), or auth.mode=passthrough." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arc-mcp.fullname" . }}
  labels:
    {{- include "arc-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "arc-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "arc-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "arc-mcp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: arc-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--transport"
            - "http"
            - "--listen"
            - "0.0.0.0:{{ .Values.http.port }}"
            - "--max-rows"
            - {{ .Values.arc.maxRows | quote }}
            - "--timeout"
            - {{ .Values.arc.timeout | quote }}
            - "--max-response-size"
            - {{ .Values.arc.maxResponseSize | quote }}
            - "--max-concurrent"
            - {{ .Values.http.maxConcurrent | quote }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.http.tlsSecretName }}
            - "--tls-cert"
            - "/etc/arc-mcp/tls/tls.crt"
            - "--tls-key"
            - "/etc/arc-mcp/tls/tls.key"
            {{- end }}
          env:
            - name: ARC_URL
              value: {{ .Values.arc.url | quote }}
            {{- if $passthrough }}
            - name: ARC_MCP_AUTH_MODE
              value: "passthrough"
            {{- if $tlsUpstream }}
            - name: ARC_MCP_TLS_UPSTREAM
              value: "true"
            {{- end }}
            {{- else }}
            - name: ARC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "arc-mcp.tokenSecretName" . }}
                  key: {{ include "arc-mcp.tokenSecretKey" . }}
                  optional: true
            {{- end }}
            - name: ARC_MCP_TOOLS
              value: {{ join "," .Values.arc.tools | quote }}
            {{- if .Values.arc.insecure }}
            - name: ARC_MCP_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.http.tokenSecretRef.name }}
            - name: ARC_MCP_HTTP_TOKEN_FILE
              value: "/etc/arc-mcp/http-token/{{ default "token" .Values.http.tokenSecretRef.key }}"
            {{- else if not $passthrough }}
            - name: ARC_MCP_INSECURE_LISTEN
              value: "true"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.http.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- if and $.Values.http.tlsSecretName .httpGet }}
            {{- toYaml (merge (dict "httpGet" (dict "scheme" "HTTPS")) .) | nindent 12 }}
            {{- else }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- if and $.Values.http.tlsSecretName .httpGet }}
            {{- toYaml (merge (dict "httpGet" (dict "scheme" "HTTPS")) .) | nindent 12 }}
            {{- else }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if or .Values.http.tokenSecretRef.name .Values.http.tlsSecretName }}
          volumeMounts:
            {{- if .Values.http.tokenSecretRef.name }}
            - name: http-token
              mountPath: /etc/arc-mcp/http-token
              readOnly: true
            {{- end }}
            {{- if .Values.http.tlsSecretName }}
            - name: tls
              mountPath: /etc/arc-mcp/tls
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- if or .Values.http.tokenSecretRef.name .Values.http.tlsSecretName }}
      volumes:
        {{- if .Values.http.tokenSecretRef.name }}
        - name: http-token
          secret:
            secretName: {{ .Values.http.tokenSecretRef.name }}
            items:
              - key: {{ default "token" .Values.http.tokenSecretRef.key }}
                path: {{ default "token" .Values.http.tokenSecretRef.key }}
        {{- end }}
        {{- if .Values.http.tlsSecretName }}
        - name: tls
          secret:
            secretName: {{ .Values.http.tlsSecretName }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
